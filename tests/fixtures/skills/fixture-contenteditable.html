<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fixture — contenteditable page</title>
<script src="_recorder.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 40rem; line-height: 1.5; }
  .post { border: 1px solid #ccc; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .author { font-weight: 600; }
  [data-skill-fixture="composer"] {
    min-height: 4rem; border: 1px solid #999; border-radius: 4px;
    padding: 0.5rem; font: inherit; white-space: pre-wrap;
  }
  [data-skill-fixture="composer"]:empty::before {
    content: "Write a reply…"; color: #999;
  }
  [data-skill-fixture="composer"]:focus { outline: 2px solid #4a90d9; }
  .row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  button { font: inherit; padding: 0.35rem 0.9rem; cursor: pointer; }
  #receipt { color: #0a7a0a; font-weight: 600; }
  #fixture-log { background: #f5f5f5; padding: 0.5rem; overflow: auto; max-height: 12rem; }
</style>
</head>
<body>
<h1>Fixture — contenteditable page</h1>

<div class="post">
  <span class="author">Bob</span>
  <p data-skill-fixture="target">The deploy is green, shipping now.</p>
</div>

<div data-skill-fixture="composer" contenteditable="true"></div>
<div class="row">
  <button type="button" data-skill-fixture="submit">Post reply</button>
  <button type="button" id="reset">Reset</button>
</div>

<p id="receipt" hidden></p>
<details>
  <summary>Fixture log</summary>
  <pre id="fixture-log"></pre>
</details>

<script>
(function () {
  "use strict";
  var composer = document.querySelector('[data-skill-fixture="composer"]');
  var submitButton = document.querySelector('button[data-skill-fixture="submit"]');

  function draftText() {
    // contenteditable yields nbsp/whitespace nodes when "empty".
    return (composer.textContent || "").replace(/\u00a0/g, " ").trim();
  }

  function submit(event) {
    var draft = draftText();
    if (draft === "") {
      window.__fixture.record("rejected-empty");
      return;
    }
    window.__fixture.markSubmitted(draft);
  }

  submitButton.addEventListener("click", submit);
  document.getElementById("reset").addEventListener("click", function () {
    composer.textContent = "";
    window.__fixture.reset();
  });
})();
</script>
</body>
</html>
