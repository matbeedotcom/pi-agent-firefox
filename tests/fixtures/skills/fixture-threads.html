<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fixture-threads — skills fixture</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.4; }
    h1 { font-size: 1.25rem; }
    .thread { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem; }
    .target { background: #f5f5f5; padding: 0.5rem 0.75rem; border-radius: 6px; }
    .author { font-weight: 600; }
    textarea { width: 100%; box-sizing: border-box; min-height: 3rem; margin: 0.5rem 0; padding: 0.4rem; }
    button { margin-right: 0.5rem; padding: 0.35rem 0.75rem; cursor: pointer; }
    #receipt { color: #14661f; font-weight: 600; }
    details { margin-top: 1.5rem; }
    #fixture-log { background: #111; color: #ddd; padding: 0.75rem; border-radius: 6px; min-height: 2rem; white-space: pre-wrap; }
  </style>
  <script src="_recorder.js"></script>
</head>
<body>
  <h1>fixture-threads — two independent comment threads</h1>

  <div class="thread">
    <p class="target" data-skill-fixture="target"><span class="author">Alice:</span> Anyone up for a hike this weekend?</p>
    <textarea id="fixture-thread-1-composer" data-skill-fixture aria-label="Reply to Alice"></textarea>
    <button data-skill-fixture="submit">Post reply</button>
  </div>

  <div class="thread">
    <p class="target" data-skill-fixture="target"><span class="author">Bob:</span> Great talk today, notes?</p>
    <textarea id="fixture-thread-2-composer" data-skill-fixture aria-label="Reply to Bob"></textarea>
    <button data-skill-fixture="submit">Post reply</button>
  </div>

  <button id="fixture-reset">Reset</button>
  <p id="receipt" hidden></p>

  <details>
    <summary>Fixture event log</summary>
    <pre id="fixture-log"></pre>
  </details>

  <script>
    (function () {
      "use strict";

      // Respect the add-on: if the page-runtime held the gesture, it has
      // already preventDefault()'d the event — the site must not post.
      // (The page itself never calls preventDefault().)
      function submit(event, threadPrefix, composer) {
        if (event.defaultPrevented) {
          window.__fixture.record("held", { thread: threadPrefix });
          return;
        }
        var draft = composer.value.trim();
        if (draft === "") {
          window.__fixture.record("rejected-empty");
          return;
        }
        window.__fixture.markSubmitted(threadPrefix + ": " + draft);
      }

      var thread1Composer = document.getElementById("fixture-thread-1-composer");
      var thread2Composer = document.getElementById("fixture-thread-2-composer");

      var buttons = document.querySelectorAll("button[data-skill-fixture=submit]");
      buttons[0].addEventListener("click", function (event) {
        submit(event, "thread1", thread1Composer);
      });
      buttons[1].addEventListener("click", function (event) {
        submit(event, "thread2", thread2Composer);
      });

      document.getElementById("fixture-reset").addEventListener("click", function () {
        thread1Composer.value = "";
        thread2Composer.value = "";
        window.__fixture.reset();
      });
    })();
  </script>
</body>
</html>
