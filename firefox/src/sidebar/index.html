<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <div id="status" title="">connecting…</div>
        <div class="topbar-actions">
          <button id="refresh" title="Refresh session list">⟳</button>
          <button id="new-session" title="New session">+ New</button>
        </div>
      </header>

      <div id="new-panel" class="hidden">
        <label for="cwd-input">Working directory</label>
        <input id="cwd-input" type="text" placeholder="/path/to/project" autocomplete="off" spellcheck="false" />
        <div class="row">
          <button id="cwd-create">Create session</button>
          <button id="cwd-cancel" class="secondary">Cancel</button>
        </div>
      </div>

      <ul id="sessions"></ul>

      <div id="active-pane" class="hidden">
        <div id="meta-row"></div>
        <div id="config-row" class="hidden"></div>
        <div id="binding-row"></div>
        <div id="conversation"></div>
        <div id="composer">
          <textarea id="prompt" rows="3" placeholder="Ask Pi… (Enter to send, Shift+Enter for newline)"></textarea>
          <div class="row">
            <button id="send">Send</button>
            <button id="stop" class="secondary hidden">Stop</button>
          </div>
        </div>
      </div>

      <div id="empty" class="hidden">
        <p>No session selected.</p>
        <p class="muted">Create one with “+ New”, or pick an existing session above.</p>
      </div>
    </div>
    <script src="sidebar.js"></script>
  </body>
</html>
